name: dists

on:
  pull_request:
  push:
    branches: [master]
  release:
    types: [released, prereleased]
  workflow_dispatch:  # allows running workflow manually from the Actions tab

concurrency:  # https://stackoverflow.com/questions/66335225#comment133398800_72408109
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wheel:
    name: ${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: macos-15,       target: x86_64,  manylinux: auto}
        - { os: macos-15,       target: aarch64, manylinux: auto}
        - { os: ubuntu-24.04,   target: x86_64,  manylinux: auto}
        - { os: ubuntu-24.04,   target: aarch64, manylinux: auto}
        - { os: ubuntu-24.04,   target: i686,    manylinux: auto}
        - { os: ubuntu-24.04,   target: armv7,   manylinux: auto}
        - { os: ubuntu-24.04,   target: ppc64le, manylinux: auto}
        - { os: ubuntu-24.04,   target: s390x,   manylinux: auto}
        - { os: ubuntu-24.04,   target: riscv64, manylinux: auto}
        - { os: ubuntu-24.04,   target: x86_64,  manylinux: musllinux_1_1 }
        - { os: ubuntu-24.04,   target: aarch64, manylinux: musllinux_1_1 }
        - { os: windows-2025,   target: x86_64,  manylinux: auto}
        - { os: windows-2025,   target: i686,    manylinux: auto}
        - { os: windows-11-arm, target: aarch64, manylinux: auto}

    runs-on: ${{ matrix.os }}
    env:
      # keep python versions in sync with
      #   - pyproject.toml
      #   - tests.yml
      PYTHON_VERSIONS: 3.11 3.12 3.13 3.14 3.15 3.14t 3.15t
    steps:
    - uses: actions/checkout@v7

    # No setup-python needed. To compile an extension module maturin only needs
    # metadata about the target python (version, abi flags, file suffix), which
    # it ships as a lookup table, and on Windows an import lib listing the
    # symbols in pythonXY.dll, which pyo3 >=0.29 generates itself. On Linux the
    # build runs inside the manylinux container, which has real interpreters.
    - uses: PyO3/maturin-action@v1.51.0
      with:
        target: ${{ matrix.target }}
        manylinux: ${{ matrix.manylinux }}
        args: --release --out dist --interpreter ${{ env.PYTHON_VERSIONS }}
        rust-toolchain: stable
        docker-options: -e CI

    # Otherwise we silently ship an incomplete set.
    # See https://github.com/oconnor663/blake3-py/issues/52.
    - name: check that we built one wheel per interpreter
      shell: bash
      run: |
        ls -ltra dist/
        expected=$(wc -w <<< "$PYTHON_VERSIONS")
        built=$(find dist -name '*.whl' | wc -l)
        test "$built" -eq "$expected" || { echo "::error::built $built wheels, expected $expected"; exit 1; }

    - uses: actions/upload-artifact@v7
      with:
        name: dist-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
        path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - uses: PyO3/maturin-action@v1.51.0
      with:
        command: sdist
        args: --out dist
        rust-toolchain: stable

    - uses: actions/upload-artifact@v7
      with:
        name: dist-sdist
        path: dist

  publish:
    if: github.event_name == 'release'
    needs: [wheel, sdist]
    runs-on: ubuntu-24.04

    permissions:
      contents: write  # softprops/action-gh-release
      id-token: write  # pypa/gh-action-pypi-publish

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist/
        pattern: dist-*
        merge-multiple: true

    - run: ls -ltra dist/

    - name: Upload release assets
      uses: softprops/action-gh-release@v3.0.3
      with:
        files: dist/*

    # trusted publisher in https://pypi.org/manage/project/blake3/settings/publishing/
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.2
      with:
        skip-existing: true
